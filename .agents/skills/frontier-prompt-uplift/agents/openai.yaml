interface:
  display_name: "Frontier Prompt Uplift"
  short_description: "Selectively refactor an existing prompt for a frontier-class model — subtract stale scaffolding, raise instruction altitude, add intent and boundaries; proposal only, and declining is a valid result"
  default_prompt: "Use frontier-prompt-uplift to refactor this prompt for a frontier-class model. Apply the applicability gate first and say the outcome out loud: an uplift runs only when the target model is identified, an existing baseline prompt was supplied, and there is a named reason to suspect stale scaffolding, a suppressed ceiling, or a model-migration mismatch. Decline ordinary task execution, new-prompt authoring, copyediting, speculative optimization, weaker-model downshifting, and any repository-owned skill or instruction file the requester did not name by path — 'no uplift warranted' with the failing criterion is a successful outcome and carries no rewritten prompt, not even a partial one. If the gate opens, establish the target model from the requester or the executing host without carrying frozen per-model tables into the answer, read the baseline in its repository context when it is repository-bound, classify the input, and diagnose on the two-sided rubric. Then subtract stale scaffolding with a restore note for every removal, raise altitude clause by clause keeping deliberate low-altitude exceptions, add only the load-bearing content the baseline lacks plus counters for failure modes actually observed, and name the off-prompt levers the requester must set themselves. Never remove a safety constraint, authority limit, destructive-action gate, legal text, verifiable local fact, or hard user constraint; never grant authority the baseline did not have; keep a line and ask when you cannot tell whether it is load-bearing. Run the damage self-check before emitting, then deliver a proposal — rewritten prompt stamped with target and date, change ledger with restore notes, both rubric sides unnetted, off-prompt recommendations, and open risks. Propose only: writing the rewrite into any file is a separate action requiring explicit authorization."
