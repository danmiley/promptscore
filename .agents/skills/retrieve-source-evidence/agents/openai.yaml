interface:
  display_name: "Retrieve Source Evidence"
  short_description: "Evidence-gated retrieval ladder — static, sitemap, web archive, data endpoints, render, mirrors — into a provenance-bearing cache with honest per-dimension outcomes"
  default_prompt: "Use retrieve-source-evidence to harvest this subject's sources into a provenance-bearing local cache. Discover the host repo's cache layout and outcome vocabulary first, preflight what this session can actually reach (including per-origin browser gating), and verify subject identity before trusting any pre-filled field. Climb the ladder only on evidence: static fetch, then sitemap and alternate paths, then the web archive via CDX discovery and raw id_ captures, then data endpoints, then a browser render, and only then mirrors. Classify every response with scripts/classify_content.py before recording coverage — a 200 is not content. Record retrieval rung, requested and final URL, content_datetime separately from retrieved_at, extraction method, and the classifier verdict. Classify each barrier as technical, policy, or throttle, and refuse policy barriers with the URL and the refusal quoted rather than circumventing them. Emit exactly one outcome per dimension from retrieved / shell / archived-only / reconstructed / absent / refused / deferred, and close with what was looked for, not found, and where to look next."
