interface:
  display_name: "Independent Audit"
  short_description: "Independent verification of work at a decision point: read-only audit against a named standard, producing a decision-grade report with stable finding IDs, evidence, fix order, and an explicit gate verdict"
  default_prompt: "Use independent-audit to audit this work: run the authority/safety preflight, pin the subject state and comparison base, resolve the named standards, build an independent risk map before reading any auditee brief, verify every claim independently (including the installed/deployed shape), classify findings with stable IDs, severity, confidence, and relationship, credit what works, record passed/failed/not-performed/not-applicable validation evidence, and close with a dependency-ordered fix list and an explicit gate recommendation. Write the report to docs/audits/YYYY-MM-DD-<subject>-audit.md using the skill's report template (keep its recognition frontmatter; repo-relative citations only). Read-only otherwise: the report file is the audit's single authorized write — report findings, do not fix them."
